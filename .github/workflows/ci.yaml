name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            mcpd-setup/package-lock.json

      # Root Electron app.
      - name: Install root dependencies
        run: npm ci

      - name: Typecheck root
        run: npx tsc --noEmit

      - name: Build root
        run: npm run build

      # Sub-packages.
      - name: Install and build mcpd-setup
        working-directory: mcpd-setup
        run: npm ci && npm run build
